name: Deploy (Render)

# Push-to-main deploys are handled by Render's own Git integration
# (autoDeploy owns push deploys) — no workflow needed for the common path.
# This workflow is the MANUAL re-deploy fallback (Actions -> Run workflow): it
# gates on the checks, triggers a Render deploy, waits for it to go live, runs a
# post-deploy smoke, and rolls back automatically if the smoke fails.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Override with a repository variable; defaults to the known prod URL.
  SERVICE_URL: ${{ vars.SERVICE_URL || 'https://research-orchestration-agents.onrender.com' }}

jobs:
  gate:
    name: Gate (lint, types, unit, evals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run tach check
      - run: uv run mypy src
      - run: uv run pytest tests/unit -q
      - run: uv run python evals/runner.py

  deploy:
    name: Deploy, smoke, rollback on failure
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy
        id: trigger
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Render secrets not configured; skipping deploy (gate still ran)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o body.json -w "%{http_code}" -X POST "$url" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}') || code=000
            echo "attempt ${attempt} -> HTTP ${code}"
            case "$code" in
              2*)
                deploy_id=$(python -c "import json;print(json.load(open('body.json')).get('id',''))")
                echo "deploy_id=$deploy_id"
                echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              4*)
                echo "::error::Render rejected the deploy (HTTP ${code}) — check RENDER_API_KEY / RENDER_SERVICE_ID"
                exit 1
                ;;
              *)
                echo "Render API unavailable (HTTP ${code}); retrying in $((attempt * 15))s..."
                sleep $((attempt * 15))
                ;;
            esac
          done
          echo "::warning::Render deploy API stayed unavailable; the service keeps its last good deploy."
          echo "skipped=true" >> "$GITHUB_OUTPUT"

      - name: Wait for the deploy to go live
        if: steps.trigger.outputs.skipped != 'true' && steps.trigger.outputs.deploy_id != ''
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          url="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}"
          for i in $(seq 1 60); do
            status=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" "$url" \
              | python -c "import json,sys;print(json.load(sys.stdin).get('status',''))")
            echo "deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|deactivated) echo "::error::deploy ${status}"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::timed out waiting for the deploy to go live"
          exit 1

      - name: Post-deploy smoke (health + readiness + a qa run)
        if: steps.trigger.outputs.skipped != 'true'
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          echo "waiting for ${SERVICE_URL} ..."
          for i in $(seq 1 30); do
            curl -fsS "$SERVICE_URL/health" >/dev/null 2>&1 && break
            sleep 10
          done
          curl -fsS "$SERVICE_URL/health" | tee health.json
          curl -fsS "$SERVICE_URL/readiness" | tee readiness.json
          grep -Eq '"ok":[[:space:]]*true' readiness.json || { echo "::error::readiness not ok"; exit 1; }
          if [ -z "$API_TOKEN" ]; then
            echo "::warning::API_TOKEN unset; skipping the live qa-run smoke"
            exit 0
          fi
          tid=$(curl -fsS -X POST -H "Authorization: Bearer $API_TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"post-deploy smoke: what is retrieval augmented generation","workflow":"qa"}' \
            "$SERVICE_URL/research" | python -c "import json,sys;print(json.load(sys.stdin).get('task_id',''))")
          echo "smoke task: $tid"
          for i in $(seq 1 60); do
            s=$(curl -fsS -H "Authorization: Bearer $API_TOKEN" "$SERVICE_URL/result/$tid" \
              | python -c "import json,sys;print(json.load(sys.stdin).get('status',''))")
            echo "task status: $s"
            [ "$s" = "done" ] && exit 0
            [ "$s" = "error" ] && { echo "::error::smoke run errored"; exit 1; }
            sleep 10
          done
          echo "::error::smoke run timed out"
          exit 1

      # Roll back to the previous deploy when the smoke fails. Verify the
      # endpoint shape against the Render API docs before relying on it in anger.
      - name: Roll back on failure
        if: failure() && steps.trigger.outputs.skipped != 'true'
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "::warning::smoke failed — rolling back to the previous deploy"
          prev=$(curl -sS -H "Authorization: Bearer ${RENDER_API_KEY}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=2" \
            | python -c "import json,sys;d=json.load(sys.stdin);print(d[1]['deploy']['id'] if len(d) > 1 else '')")
          if [ -z "$prev" ]; then
            echo "::error::no previous deploy found for rollback"
            exit 1
          fi
          curl -fsS -X POST -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"deployId\": \"$prev\"}" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/rollback"
