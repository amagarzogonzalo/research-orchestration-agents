name: Deploy (Render)

# Push-to-main deploys are handled by Render's own Git integration
# (autoDeploy: yes, trigger: commit) — no workflow needed for the common path.
# This workflow is a MANUAL re-deploy fallback (Actions -> Run workflow) that
# gates on the checks first. Keeping it off `push` avoids two racing deploys per
# commit (an auto `new_commit` deploy plus an `api` one).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Gate (lint, types, unit, evals)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run tach check
      - run: uv run mypy src
      - run: uv run pytest tests/unit -q
      - run: uv run python evals/runner.py

  deploy:
    name: Trigger Render deploy
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via the Render API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "Render secrets not configured; skipping deploy (gate still ran)."
            exit 0
          fi
          url="https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o body.json -w "%{http_code}" -X POST "$url" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"clearCache": "do_not_clear"}') || code=000
            echo "attempt ${attempt} -> HTTP ${code}"
            cat body.json 2>/dev/null || true
            case "$code" in
              2*)
                echo "deploy triggered"
                exit 0
                ;;
              4*)
                echo "::error::Render rejected the deploy (HTTP ${code}) — check RENDER_API_KEY / RENDER_SERVICE_ID"
                exit 1
                ;;
              *)
                echo "Render API unavailable (HTTP ${code}); retrying in $((attempt * 15))s..."
                sleep $((attempt * 15))
                ;;
            esac
          done
          echo "::warning::Render deploy API stayed unavailable; the service keeps running its last good deploy. Re-run this workflow later."
          exit 0
