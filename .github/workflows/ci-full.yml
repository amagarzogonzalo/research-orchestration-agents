name: CI-full

# Long gate: runs ONLY on main pushes and merge requests (pull_request).
# Integration + e2e + types + evals + coverage; the fast gate (ci.yml: unit +
# lint + arch + secrets) already ran on every push.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OTEL_TRACES_EXPORTER: ""
      OTEL_METRICS_EXPORTER: "none"
      PYTHONPATH: src
      WIKI_TEST_PG_DSN: postgresql://wiki:wiki@localhost:5432/wiki
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki
          POSTGRES_DB: wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiki -d wiki"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Lockfile is in sync
        run: uv lock --check

      - name: Install the locked environment
        run: uv sync --frozen --extra dev --extra store

      - name: Apply wiki migrations (drop v1, apply v2)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$WIKI_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261012160701_drop_wiki_v1.sql
          psql "$WIKI_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261012160700_wiki_v2.sql

      - name: Integration tests (fakes + file checkpointer + real Postgres wiki, no network)
        run: uv run pytest tests/integration -q -p no:cacheprovider -m "not live"

      - name: E2E tests (full LangGraph runtime, fakes; live opt-in)
        run: uv run pytest tests/e2e -q -p no:cacheprovider -m "not live"

  typecheck:
    name: Typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra store
      - name: mypy (strict on new architecture; adapter glue exempt)
        run: uv run mypy src --no-error-summary
      - name: pydoclint (Google docstrings required)
        run: uv run pydoclint --style google --arg-type-hints-in-docstring 0 --skip-checking-raises 1 --allow-init-docstring 1 src/knowledge_engine

  coverage:
    name: Offline suite + coverage gate
    runs-on: ubuntu-latest
    env:
      OTEL_TRACES_EXPORTER: ""
      OTEL_METRICS_EXPORTER: "none"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra store
      # The floor is [tool.coverage.report] fail_under in pyproject.toml.
      - name: Offline suite + coverage
        run: uv run pytest tests/ -q -m "not live" --cov=knowledge_engine --cov-report=term-missing

  evals:
    name: Behavioral evals (offline replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra store
      - name: Offline eval replay (free, deterministic)
        run: uv run python evals/runner.py
