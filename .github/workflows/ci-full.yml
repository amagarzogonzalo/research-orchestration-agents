name: CI-full

# Long gate: runs ONLY on main pushes and merge requests (pull_request).
# Integration + e2e + types + evals are slower/heavier; the fast gate
# (ci.yml: unit + lint + arch) already ran on every push.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    name: Integration tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OTEL_TRACES_EXPORTER: ""
      OTEL_METRICS_EXPORTER: "none"
      PYTHONPATH: src
      WIKI_TEST_PG_DSN: postgresql://wiki:wiki@localhost:5432/wiki
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki
          POSTGRES_DB: wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiki -d wiki"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store]"

      - name: Apply wiki migrations (drop v1, apply v2)
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          psql "$WIKI_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261012160701_drop_wiki_v1.sql
          psql "$WIKI_TEST_PG_DSN" -v ON_ERROR_STOP=1 -f supabase/migrations/20261012160700_wiki_v2.sql

      - name: Integration tests (fakes + file checkpointer + real Postgres wiki, no network)
        run: python -m pytest tests/integration -q -p no:cacheprovider

      - name: E2E tests (full LangGraph runtime, fakes; live opt-in)
        run: python -m pytest tests/e2e -q -p no:cacheprovider

  typecheck:
    name: Typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store]"
          # pydoclint imports DocstringYields from docstring_parser.common, but
          # BOTH docstring-parser and docstring_parser_fork ship that path, so
          # the last-installed wins. The fork (0.0.16) has it, the real
          # package (0.18.0) does not — force the fork last for determinism.
          pip install --force-reinstall --no-deps "docstring_parser_fork==0.0.16"
      - name: mypy (strict on new architecture; adapter glue exempt)
        run: mypy src --no-error-summary
      - name: pydoclint (Google docstrings required)
        run: pydoclint --style google --arg-type-hints-in-docstring 0 --skip-checking-raises 1 --allow-init-docstring 1 src/knowledge_engine

  evals:
    name: Behavioral evals (offline replay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,store]"
      - name: Offline eval replay (free, deterministic)
        run: python evals/runner.py
