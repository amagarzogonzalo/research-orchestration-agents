name: Wiki backup

# Supabase Free has no PITR: dump the curated wiki bucket to a GitHub artifact
# weekly. Requires the repo secrets SUPABASE_URL + SUPABASE_SECRET_KEY.
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Back up the wiki bucket
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra supabase
      - name: Dump the wiki bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: uv run python -m knowledge_engine.scripts.backup_wiki --bucket wiki --out wiki-backup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wiki-backup
          path: wiki-backup/
          if-no-files-found: warn
