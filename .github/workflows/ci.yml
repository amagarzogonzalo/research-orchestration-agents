name: CI

# Fast gate: runs on every PR and on pushes to main/staging. Unit tests + lint +
# static checks only — no network, no heavy deps. The long suite (integration,
# e2e, types, evals, coverage) runs on main + PRs via ci-full.yml.
on:
  push:
    branches: [main, staging]
  pull_request:

# Cancel superseded runs on the same ref: a push that invalidates an in-flight
# run must not keep spending minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OTEL_TRACES_EXPORTER: ""
      OTEL_METRICS_EXPORTER: "none"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Lockfile is in sync with pyproject.toml
        run: uv lock --check

      # The locked environment is what CI tests — never a hand-picked dep list.
      - name: Install the locked environment
        run: uv sync --frozen --extra dev

      - name: Unit tests (pure logic, offline)
        run: uv run pytest tests/unit -q -p no:cacheprovider

  lint:
    name: Lint + arch (ruff, tach, semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - name: Module boundaries
        run: uv run tach check
      - name: OpenAPI snapshot is current
        run: uv run python bin/export_openapi.py --check
      - name: Custom security/correctness rules
        run: uvx semgrep --config .semgrep/rules/ --metrics=off --error src tests

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (entire git history; .gitleaks.toml allowlists eval fixtures)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wikibench:
    name: WikiBench gate (deterministic, offline)
    runs-on: ubuntu-latest
    env:
      OTEL_TRACES_EXPORTER: ""
      OTEL_METRICS_EXPORTER: "none"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the locked environment
        run: uv sync --frozen --extra dev
      - name: WikiBench gate vs bench/wikibench/baseline.json
        run: uv run python -m knowledge_engine.scripts.wikibench --report --check
      - name: Publish report to the run summary
        if: always()
        run: cat bench/wikibench/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wikibench-report
          path: bench/wikibench/report.json
