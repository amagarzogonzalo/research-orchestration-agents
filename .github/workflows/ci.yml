name: CI

# Fast gate: runs on EVERY push and every merge request. Unit tests + lint +
# static checks only — no network, no heavy deps. The long suite
# (integration, e2e, types, evals) additionally runs on main + merge requests
# via ci-full.yml.
on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OTEL_TRACES_EXPORTER: ""
      OTEL_METRICS_EXPORTER: "none"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-critical deps
        run: |
          python -m pip install --upgrade pip
          pip install pydantic tenacity httpx opentelemetry-sdk \
            opentelemetry-exporter-otlp-proto-http pytest pytest-asyncio \
            langgraph pyyaml hypothesis fastapi

      - name: Unit tests (pure logic, offline)
        run: python -m pytest tests/unit -q -p no:cacheprovider

  lint:
    name: Lint + arch (ruff, tach, semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ruff tach
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Module boundaries
        run: tach check
      - name: Custom security/correctness rules
        run: pipx run semgrep --config .semgrep/rules/ --metrics=off --error src tests

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (entire git history; .gitleaks.toml allowlists eval fixtures)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  wikibench:
    name: WikiBench gate (deterministic, offline)
    runs-on: ubuntu-latest
    env:
      OTEL_TRACES_EXPORTER: ""
      OTEL_METRICS_EXPORTER: "none"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: uv sync --extra dev
      - name: WikiBench gate vs bench/wikibench/baseline.json
        run: uv run python -m knowledge_engine.scripts.wikibench --report --check
      - name: Publish report to the run summary
        if: always()
        run: cat bench/wikibench/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wikibench-report
          path: bench/wikibench/report.json
