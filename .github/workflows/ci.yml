name: CI

# Fast gate: runs on EVERY push and every merge request. Unit tests + lint +
# static checks only — no network, no heavy deps. The long suite
# (integration, e2e, types, evals) additionally runs on main + merge requests
# via ci-full.yml.
on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      OTEL_TRACES_EXPORTER: ""
      OTEL_METRICS_EXPORTER: "none"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test-critical deps
        run: |
          python -m pip install --upgrade pip
          pip install pydantic tenacity httpx opentelemetry-sdk \
            opentelemetry-exporter-otlp-proto-http pytest pytest-asyncio \
            langgraph pyyaml hypothesis

      - name: Unit tests (pure logic, offline)
        run: python -m pytest tests/unit -q -p no:cacheprovider

  lint:
    name: Lint + arch (ruff, tach, semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff tach
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Module boundaries
        run: tach check
      - name: Custom security/correctness rules
        run: pipx run semgrep --config .semgrep/rules/ --metrics=off --error src tests

  wikibench:
    name: WikiBench gate (deterministic, offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync --extra dev
      - name: WikiBench gate vs bench/wikibench/baseline.json
        run: uv run python -m knowledge_engine.scripts.wikibench --report --check
      - name: Publish report to the run summary
        if: always()
        run: cat bench/wikibench/report.md >> "$GITHUB_STEP_SUMMARY"
