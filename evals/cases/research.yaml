# Real end-to-end research run: full LangGraph workflow (ingest -> relevance ->
# bodies -> synthesize -> judge -> review -> render) with search/scrape/LLM
# recorded to cassettes. Replay is offline and deterministic.
id: research
description: >
  A complete research() run stays structurally sound: YAML frontmatter with
  provenance, at least two sections, cited quantitative claims, valid footnote
  links, and bounded token/call/latency cost.

entrypoint: "evals.adapters:research_run"
input:
  query: "How retrieval-augmented generation reduces hallucinations in large language models"
  max_sources: 5

samples: 1
pass_at_k: 1

invariants:
  frontmatter_keys: ["@id", type, title, provenance, citations, tldr_llm]
  min_sections: 2
  must_cite: []
  no_uncited_claims: true
  valid_links: true
  forbidden_patterns: ["as an ai", "\\bTODO\\b", "as of my (last )?(knowledge|training)"]
  max_chars: 30000

budget:
  max_total_tokens: 200000
  max_model_calls: 40
  max_wall_s: 1200

judge:
  rubric: rubrics/default.md
  min_score: 6
  samples: 1
