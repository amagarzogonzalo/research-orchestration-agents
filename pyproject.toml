[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "knowledge-engine"
version = "0.1.0"
description = "Autonomous Knowledge Curation Engine — zero-cost, hexagonally-architected research pipeline."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    "redis>=8.1,<9",
    "psycopg[binary]>=3.3,<4",
    "tenacity>=9.1,<10",
    "httpx>=0.27,<1",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "langchain-core>=1.6,<2",
    "instructor>=1.16,<2",
    "litellm>=1.99,<2",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-logging>=0.44b0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
scrape = ["crawl4ai>=0.9,<0.10", "trafilatura>=2.2,<3"]
memory = ["letta>=0.16,<0.17"]
vector = ["qdrant-client>=1.19,<2"]
providers = ["groq>=1.7,<2", "openai>=3.7,<4", "google-genai"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]