[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "knowledge-engine"
version = "0.1.0"
description = "Portable, zero-cost research library: LangGraph orchestration, file-only persistence, browser automation, free-LLM discovery."
readme = "README.md"
authors = [{ name = "amaga", email = "amagarzogonzalo@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7,<3",
    "tenacity>=9.1,<10",
    "httpx>=0.27,<1",
    "instructor>=1.16,<2",
    "litellm>=1.99,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint>=4.2,<5",
    "langchain[mcp]>=1.4,<2",
    "mcp>=2.1,<3",
    "opentelemetry-sdk>=1.44,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
    "opentelemetry-instrumentation-logging>=0.44b0",
    "pyyaml>=6.0",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
scrape = ["crawl4ai>=0.9,<0.10", "trafilatura>=2.2,<3", "playwright>=1.62,<2"]
browser = ["playwright>=1.62,<2", "selenium>=4.20,<5"]
store = ["psycopg[binary,pool]>=3.1,<4", "langgraph-checkpoint-postgres>=3,<4"]  # Supabase Postgres checkpointer + store (opt-in)
evals = ["deepeval>=4.2,<5"]  # DeepEval metrics (opt-in; default eval path stays cassette-only)
providers = ["groq>=1.7,<2", "openai>=2.20,<3", "google-genai"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.100,<7",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pydoclint>=0.3,<1",
    "tach>=0.35.3",
    # NOTE: semgrep is intentionally NOT a venv dependency (it pins
    # conflicting opentelemetry/mcp versions). It runs isolated via
    # `uvx semgrep`, the pre-commit hook, and CI (pipx). See Makefile `semgrep`.
    "langgraph-checkpoint-conformance>=0.0.2",
]
supabase = [
    "supabase>=2.32.0",
]

[project.hatch.build.targets.wheel]
packages = ["src/knowledge_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "live: real-network tests (require free-tier keys in .env); excluded by default",
]
filterwarnings = [
    # langchain.mcp is officially beta; suppress its per-import notice.
    "ignore:`langchain\\.mcp` is in beta",
]

[tool.coverage.run]
source = ["knowledge_engine"]
branch = true

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]  # pydantic Field(default_factory=...) triggers B008 profiler ban

[tool.ruff.lint.isort]
known-first-party = ["knowledge_engine"]

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
exclude = ["tests"]

[[tool.mypy.overrides]]
# Legacy vendor-glue adapters (pre-refactor). They wrap third-party SDKs whose
# typing is unhelpfully broad. They are excluded from the strict gate (new
# architecture code must stay strict); revisit incrementally in future passes.
module = [
    "knowledge_engine.infrastructure.search.*",
    "knowledge_engine.infrastructure.providers",
    "knowledge_engine.infrastructure.router",
    "knowledge_engine.infrastructure.rate_limit",
    "knowledge_engine.infrastructure.circuit",
    "knowledge_engine.infrastructure.scrape.crawl4ai_adapter",
    "knowledge_engine.observability.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Supabase vendor-glue adapters: the `supabase` SDK ships no stubs, so mypy
# cannot resolve `create_client` when only the base/dev extras are installed
# (the CI typecheck job). Exempt them from the strict gate like the other
# vendor-glue adapters above; the ports they implement stay strict.
module = [
    "knowledge_engine.store.supabase_body_storage",
    "knowledge_engine.store.supabase_artifact_store",
    "knowledge_engine.infrastructure.wiki.supabase_store",
    "knowledge_engine.scripts.retention",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Browser automation + LLM-discovery adapters drive untyped vendor SDKs
# (Playwright/Selenium/raw httpx). Their glue is intentionally loose-typed;
# the ports/schemas they implement stay strict.
module = [
    "knowledge_engine.infrastructure.browser.*",
    "knowledge_engine.infrastructure.discovery.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# HTTP service edge (issue #30): FastAPI/Starlette decorators and request
# plumbing are vendor-glue; the engine, ports and schemas it calls stay strict.
# Mirrors the other documented adapter exemptions above.
module = [
    "knowledge_engine.service.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
# Vendor SDKs without complete stubs: treat as Any (Adapter ports hide them).
module = [
    "litellm",
    "instructor",
    "crawl4ai.*",
    "trafilatura",
    "playwright.*",
    "selenium.*",
    "letta.*",
    "psycopg.*",
    "psycopg_pool",
    "psycopg_pool.*",
    "supabase",
    "supabase.*",
    "storage3.*",
    "fastapi",
    "fastapi.*",
    "starlette.*",
    "uvicorn",
    "uvicorn.*",

    "google.*",
    "groq.*",
    "redis.*",
    "langchain.*",
    "langgraph.*",
    "langgraph_checkpoint.*",
    "mcp.*",
    "fastmcp.*",
    "yaml",
]
ignore_missing_imports = true
