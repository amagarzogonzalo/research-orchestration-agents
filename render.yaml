# Render blueprint for the Knowledge Engine HTTP service (issue #30).
# Zero-cost: Free plan + Supabase Free. Secrets are marked `sync: false` and set
# in the Render dashboard (never committed). Rollback = redeploy the previous
# build (Render keeps the artifact; .github/workflows/deploy.yml automates it).
#
# NOTE: the prod service keeps its env vars inline ON PURPOSE — moving them into
# an envVarGroup would force re-entry of the dashboard secrets on the next
# blueprint sync. staging gets its own group; point it at a SEPARATE Supabase
# project (never the prod one).

envVarGroups:
  - name: ke-staging-shared
    envVars:
      # --- cutover switches: select the Supabase cloud stack ---
      - key: CHECKPOINTER_KIND
        value: postgres
      - key: STORE_KIND
        value: postgres
      - key: ARTIFACT_STORE_KIND
        value: supabase
      - key: BODY_STORE_KIND
        value: supabase
      - key: WIKI_STORE_KIND
        value: supabase
      # --- Render Free desk math: single worker, strict msgpack ---
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      - key: JOB_TIMEOUT_SECONDS
        value: "900"
      - key: JOBS_KIND
        value: postgres
      - key: CLEANUP_AFTER_RUN
        value: "true"
      # Durable queue: one in-process worker, bounded depth, per-caller cap.
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_QUEUED_JOBS
        value: "16"
      - key: MAX_ACTIVE_JOBS_PER_CALLER
        value: "4"
      - key: JOB_STALE_SECONDS
        value: "960"
      - key: JOB_MAX_ATTEMPTS
        value: "3"
      - key: JOB_POLL_MS
        value: "500"
      # Apply pending SQL migrations at boot (idempotent, ledger-guarded).
      - key: AUTO_MIGRATE
        value: "true"
      # Keep Swagger visible on staging for debugging.
      - key: ENABLE_DOCS
        value: "true"
      # --- secrets: set per-environment in the dashboard (sync: false) ---
      # DATABASE_URL MUST be the Supabase session pooler (IPv4).
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: API_TOKEN
        sync: false
      - key: API_TOKEN_READONLY
        sync: false

services:
  # --- production: matches the live Render service (created via the dashboard) ---
  # The blueprint is a portable description of the deployed stack; it is not
  # currently synced against the live service, so keep the name in lockstep with
  # the dashboard so a future sync adopts rather than duplicates it.
  - type: web
    name: research-orchestration-agents
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    maxShutdownDelaySeconds: 60
    # Migrations run at boot via AUTO_MIGRATE (idempotent, ledger-guarded). On a
    # plan that supports pre-deploy commands you can run them before boot instead:
    # preDeployCommand: "python -m knowledge_engine.scripts.apply_migrations"
    envVars:
      # --- cutover switches: select the Supabase cloud stack ---
      - key: CHECKPOINTER_KIND
        value: postgres
      - key: STORE_KIND
        value: postgres
      - key: ARTIFACT_STORE_KIND
        value: supabase
      - key: BODY_STORE_KIND
        value: supabase
      - key: WIKI_STORE_KIND
        value: supabase
      # --- Render Free desk math: single worker, strict msgpack ---
      - key: WEB_CONCURRENCY
        value: "1"
      - key: LANGGRAPH_STRICT_MSGPACK
        value: "true"
      # Per-caller rate limit on data routes (shared Postgres window; <= 0 disables).
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      # Abort a run after this long; delete checkpoints after each run (500 MB).
      - key: JOB_TIMEOUT_SECONDS
        value: "900"
      - key: JOBS_KIND
        value: postgres
      - key: CLEANUP_AFTER_RUN
        value: "true"
      # Durable queue: one in-process worker, bounded depth, per-caller cap.
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: MAX_QUEUED_JOBS
        value: "16"
      - key: MAX_ACTIVE_JOBS_PER_CALLER
        value: "4"
      - key: JOB_STALE_SECONDS
        value: "960"
      - key: JOB_MAX_ATTEMPTS
        value: "3"
      - key: JOB_POLL_MS
        value: "500"
      # Apply pending SQL migrations at boot (idempotent, ledger-guarded).
      - key: AUTO_MIGRATE
        value: "true"
      # Hide Swagger/OpenAPI in production.
      - key: ENABLE_DOCS
        value: "false"
      # --- secrets: set in the dashboard ---
      # DATABASE_URL MUST be the Supabase session pooler (IPv4):
      # postgresql://postgres.<ref>:...@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
      # (Render has no outbound IPv6; the direct db.<ref>.supabase.co host is IPv6-only.)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENALEX_MAILTO
        sync: false
      - key: CROSSREF_MAILTO
        sync: false
      - key: API_TOKEN
        sync: false
      - key: API_TOKEN_READONLY
        sync: false

  # --- staging: same image, its own branch + Supabase project ---
  # NOTE: not provisioned. There is no `staging` branch or staging service yet;
  # create the branch and point ke-staging-shared at a SEPARATE Supabase project
  # (never prod) before connecting this blueprint.
  - type: web
    name: research-orchestration-agents-staging
    runtime: docker
    plan: free
    branch: staging
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    maxShutdownDelaySeconds: 60
    # preDeployCommand: "python -m knowledge_engine.scripts.apply_migrations"
    envVarGroups:
      - name: ke-staging-shared
